name: CRAN-source-check

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  VECLIB_MAXIMUM_THREADS: '1'

jobs:
  build-source:
    name: Build and preserve the source archive
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
      - name: Build with R release and record source identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sparsepca-source"
          cd "$RUNNER_TEMP/sparsepca-source"
          R CMD build "$GITHUB_WORKSPACE" 2>&1 | tee build.log
          sha256sum sparsepca_*.tar.gz > SHA256SUMS
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD > source-commit.txt
          git -C "$GITHUB_WORKSPACE" rev-parse 'HEAD^{tree}' > source-tree.txt
          Rscript -e 'writeLines(capture.output(sessionInfo()), "build-session.txt")'
          tar -tzvf sparsepca_*.tar.gz > archive-contents.txt
      - uses: actions/upload-artifact@v7
        with:
          name: sparsepca-CRAN-source
          path: ${{ runner.temp }}/sparsepca-source/
          if-no-files-found: error
          retention-days: 90

  check-source:
    name: Check identical archive (R ${{ matrix.r }})
    needs: build-source
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        r: [release, devel]
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::V8
          needs: check
      - uses: r-lib/actions/setup-pandoc@v2
      - name: Install HTML validation tools
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 --output tidy.deb \
            https://github.com/htacg/tidy-html5/releases/download/5.8.0/tidy-5.8.0-Linux-64bit.deb
          echo '59e594312207234f5a17455683c13c6bc47a89cb7bf994d493acfffb591d9830  tidy.deb' | sha256sum --check
          sudo dpkg -i tidy.deb
          tidy --version
      - uses: r-lib/actions/setup-tinytex@v2
      - name: Install PDF manual tools
        shell: bash
        run: |
          tlmgr update --self
          tlmgr install ae inconsolata makeindex upquote
      - uses: actions/download-artifact@v8
        with:
          name: sparsepca-CRAN-source
          path: ${{ runner.temp }}/sparsepca-source
      - name: Check archive, examples, tests, and complete manual
        working-directory: ${{ runner.temp }}/sparsepca-source
        shell: bash
        env:
          NOT_CRAN: 'false'
          _R_CHECK_CRAN_INCOMING_: 'true'
          _R_CHECK_CRAN_INCOMING_REMOTE_: 'true'
          _R_CHECK_FORCE_SUGGESTS_: 'true'
          _R_CHECK_SYSTEM_CLOCK_: 'true'
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          Rscript - <<'RSCRIPT'
          archive <- list.files(pattern = "^sparsepca_[0-9.]+[.]tar[.]gz$",
                                full.names = TRUE)
          stopifnot(length(archive) == 1L)
          check_dir <- file.path(Sys.getenv("RUNNER_TEMP"), "sparsepca-check")
          dir.create(check_dir, showWarnings = FALSE)
          writeLines(capture.output(sessionInfo()), file.path(check_dir, "check-session.txt"))
          write.table(installed.packages()[, c("Package", "Version", "Built")],
                      file.path(check_dir, "package-versions.tsv"),
                      sep = "\t", quote = FALSE, row.names = FALSE)
          file.copy(c("SHA256SUMS", "source-commit.txt", "source-tree.txt"), check_dir)
          check_env <- Sys.getenv(c(
            "NOT_CRAN", "_R_CHECK_CRAN_INCOMING_", "_R_CHECK_CRAN_INCOMING_REMOTE_",
            "_R_CHECK_FORCE_SUGGESTS_", "_R_CHECK_SYSTEM_CLOCK_",
            "OPENBLAS_NUM_THREADS", "OMP_NUM_THREADS", "MKL_NUM_THREADS",
            "VECLIB_MAXIMUM_THREADS"
          ))
          writeLines(capture.output(print(check_env)),
                     file.path(check_dir, "check-environment.txt"))
          result <- rcmdcheck::rcmdcheck(path = archive, args = "--as-cran",
            check_dir = check_dir, error_on = "never", timeout = 1500,
            env = check_env)
          saveRDS(result, file.path(check_dir, "check-result.rds"))
          writeLines(capture.output(print(result)), file.path(check_dir, "check-summary.txt"))
          if (length(result$errors) || length(result$warnings)) {
            stop("Source archive has check errors or warnings; inspect saved diagnostics.")
          }
          # All NOTES remain visible in the log and saved summary for review.
          RSCRIPT
          sha256sum --check SHA256SUMS
      - name: Preserve results, diagnostics, and manual
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sparsepca-CRAN-check-${{ matrix.r }}
          path: ${{ runner.temp }}/sparsepca-check/
          if-no-files-found: warn
          retention-days: 90
